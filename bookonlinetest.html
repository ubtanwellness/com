    :root{

    .navbar {

    .logo {

    /* main container */
    .content {

    .card-custom {

      background: var(--pink);

    }
    .btn-pink:hover { transform: translateY(-1px); }
    .btn-pink:active { transform: translateY(0); box-shadow:none; }

    .service-item { background:#fff; border-radius:10px; border:1px solid rgba(20,20,40,0.04); }

    .booking-summary-mobile {

      padding: 12px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      z-index:1050;
    }

    /* smaller screens */
    @media (max-width: 767px) {
      .desktop-only { display:none !important; }
      #mobileCartSummary { display:flex !important; }
    }

    .small-muted { color:var(--muted); font-size:.9rem; }
    .form-section-title { font-weight:600; color:#222; margin-bottom:8px; }

    /* Google sign-in button */
    .google-btn {
      background: #fff;
      border: 1px solid #e6e6e6;
      padding: 8px 12px;
      border-radius: 8px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      box-shadow:0 6px 14px rgba(10,10,20,0.04);
    }
    .google-btn img { height:18px; width:18px; }

    /* subtle modal/content tweaks */
    .modal-content { border-radius: 12px; }
    .time-slot-btn.active { background: #0d6efd; color: #fff; border-color: #0d6efd; }

  </style>
